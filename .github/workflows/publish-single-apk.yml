name: Publish single APK

on:
  push:
    branches: [master]
    paths:
      - "scripts/build_universal_apk.sh"
      - "scripts/verify_universal_apk.sh"
      - "tests/**"
      - "docs/release-notes-template.md"
      - ".github/workflows/publish-single-apk.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (for example v0.0.2)"
        required: true
        default: "v0.0.2"
        type: string
      source_tag:
        description: "Existing release with the signed .apks archive"
        required: true
        default: "v0.0.1"
        type: string
      new_signing_key:
        description: "Explicitly allow a NEW certificate ONLY for independent package kz.onay.free"
        required: true
        default: false
        type: boolean
      dry_run:
        description: "Build and verify only: keep the APK as a 3-day workflow artifact and publish nothing"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release (keep it set until the APK is tested on a device)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: single-apk-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax-check the shell scripts
        run: |
          for f in scripts/build_universal_apk.sh scripts/verify_universal_apk.sh; do bash -n "$f"; done
      - name: Run offline packaging and workflow tests
        run: python3 -m unittest discover -s tests -v

  publish:
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require existing signing key
        env:
          KEYSTORE_B64: ${{ secrets.ONAY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ONAY_KS_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure repository secrets ONAY_KEYSTORE_B64 and ONAY_KS_PASS before publishing."
            exit 1
          fi

      - name: Check release tag and target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag"; exit 1; }
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid source tag"; exit 1; }
          [ "$TAG" != "$SOURCE_TAG" ] || { echo "::error::Target and source tags must differ"; exit 1; }
          if [ "$DRY_RUN" != "true" ] && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite it"
            exit 1
          fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build tools (SDK is preinstalled on the runner)
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$sdkmanager" ] || { echo "::error::sdkmanager not found in the runner image"; exit 1; }
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install "build-tools;35.0.1" >/dev/null
          echo "$ANDROID_HOME/build-tools/35.0.1" >> "$GITHUB_PATH"

      - name: Fetch pinned apktool for package identity rebase
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar
          echo "66cf4524a4a45a7f56567d08b2c9b6ec237bcdd78cee69fd4a59c8a0243aeafa  $RUNNER_TEMP/apktool.jar" | sha256sum -c -
          echo "APKTOOL_JAR=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"

      - name: Download previously signed split archive
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          mkdir -p work/input
          gh release download "$SOURCE_TAG" --pattern '*.apks' --dir work/input
          mapfile -t archives < <(find work/input -maxdepth 1 -type f -name '*.apks' -print)
          [ "${#archives[@]}" -eq 1 ] || {
            echo "::error::Expected exactly one .apks archive in source release"
            exit 1
          }
          echo "SPLITS_ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"

      - name: Rebuild and sign one APK
        env:
          KEYSTORE_B64: ${{ secrets.ONAY_KEYSTORE_B64 }}
          ONAY_KS_PASS: ${{ secrets.ONAY_KS_PASS }}
          ONAY_KS_ALIAS: ${{ secrets.ONAY_KS_ALIAS }}
          TAG: ${{ inputs.tag }}
          ONAY_PACKAGE_NAME: kz.onay.free
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/onay"
          # The keystore is never stored in the repository or uploaded as an artifact.
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/onay/signing.jks"
          unset KEYSTORE_B64
          chmod 600 "$RUNNER_TEMP/onay/signing.jks"
          ONAY_KS="$RUNNER_TEMP/onay/signing.jks" \
          SPLITS_INPUT="$SPLITS_ARCHIVE" \
          OUTPUT_APK="work/release/onay-free-${TAG#v}.apk" \
          bash scripts/build_universal_apk.sh

      - name: Verify packaging and enforce explicit certificate policy
        env:
          TAG: ${{ inputs.tag }}
          NEW_KEY: ${{ inputs.new_signing_key }}
        run: |
          set -euo pipefail
          unzip -p "$SPLITS_ARCHIVE" base.apk > "$RUNNER_TEMP/onay/base.apk"
          src="$(apksigner verify --print-certs "$RUNNER_TEMP/onay/base.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          [ -n "$src" ] || { echo "::error::Cannot read the certificate of the source release"; exit 1; }
          apk="work/release/onay-free-${TAG#v}.apk"
          if [ "$NEW_KEY" = "true" ]; then
            # A different certificate is safe *only* because this APK is
            # independently installed as kz.onay.free, never as kz.onay.
            EXPECTED_PACKAGE=kz.onay.free bash scripts/verify_universal_apk.sh "$apk" | tee "$RUNNER_TEMP/verify.txt"
            echo "NOTICE: a new signing key was explicitly allowed for independent kz.onay.free."
          else
            EXPECTED_PACKAGE=kz.onay.free bash scripts/verify_universal_apk.sh "$apk" "$src" | tee "$RUNNER_TEMP/verify.txt"
          fi
          {
            echo "### APK checks"
            echo '```'
            cat "$RUNNER_TEMP/verify.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "APK_SHA256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Keep the APK as a short-lived artifact (dry run only)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onay-free-dry-run
          path: ${{ env.APK_PATH }}
          retention-days: 3
          if-no-files-found: error

      - name: Prepare release notes
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ inputs.tag }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          NEW_KEY: ${{ inputs.new_signing_key }}
        run: |
          set -euo pipefail
          if [ "$PRERELEASE" = "true" ]; then
            status='**Предварительный выпуск.** Упаковка проверена автоматически (структура, подпись, нативные библиотеки, сертификат). Установка и работа на реальном устройстве при выпуске не подтверждены.'
          else
            status='Выпуск отмечен как проверенный на устройстве (отметка выставлена вручную при запуске workflow).'
          fi
          sed -e "s/@SIGNING_CHANGE@/$NEW_KEY/g" \
              -e "s/@VERSION@/${TAG#v}/g" \
              -e "s/@SOURCE_TAG@/${SOURCE_TAG}/g" \
              -e "s/@SHA256@/${APK_SHA256}/g" \
              docs/release-notes-template.md > "$RUNNER_TEMP/notes.md"
          printf '%s\n' "$status" > "$RUNNER_TEMP/status.txt"
          python3 - "$RUNNER_TEMP/notes.md" "$RUNNER_TEMP/status.txt" <<'PY'
          import sys
          notes, status = sys.argv[1:3]
          text = open(notes, encoding="utf-8").read().replace("@STATUS@", open(status, encoding="utf-8").read().strip())
          open(notes, "w", encoding="utf-8").write(text)
          PY

      - name: Create release and upload APK
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          gh release create "$TAG" "$APK_PATH" \
            --target "$GITHUB_SHA" \
            --title "onay-free ${TAG#v} (single APK)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "${flags[@]}"

      - name: Remove signing artifacts from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/onay/signing.jks" "$RUNNER_TEMP/onay/base.apk" "$RUNNER_TEMP/apktool.jar"
